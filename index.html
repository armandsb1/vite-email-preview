  <body>

        </div>
        <div class="toolbar-right">

            </gux-dropdown>
            <gux-button accent="secondary"  >
              <gux-icon icon-name="fa/regular-user-circle-arrow-left" decorative id="transfer-user"></gux-icon>
              <span id="transfer-user">Transfer to user</span>
            </gux-button>
            </div>  
        
          <gux-button accent="danger"  >
            <gux-icon icon-name="delete" decorative id="delete-emails"></gux-icon>
            <span id="delete-emails">Delete</span>
          </gux-button>
        </div>
        </div>
   

      </div>
      <gux-table
        object-table
        selectable-rows

        id="sortable-table"
      >
        <table style="inline-size: 100%; table-layout: auto" slot="data">

          <thead>
            <tr data-row-id="head">
              <th id="row-select"><gux-all-row-select></gux-all-row-select></th>


              <th data-column-name="start-date" aria-sort="ascending">
                First message<gux-sort-control />
              </th>
              <th data-column-name="endDate" >LastMessage<gux-sort-control /></th>
              <th data-column-name="processingTime" >Processing time</th>
              <th data-column-name="from" >From</th>
              <th data-column-name="to" >To</th>
              <th data-column-name="subject" >Subject</th>
              <th data-column-name="status">Status</th>

              <th data-column-name="last-agent" >Last agent</th>
              <th data-column-name="queue">Queue</th>

               <th data-column-name="participant">Participant</th>
              <th data-column-name="action" data-cell-action style="text-align: center;">Action</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          
        </table>
      </gux-table>

      <gux-radial-loading id="loading" class="loading" screenreader-text="Loading..."></gux-radial-loading>

    </div>
  </div>


    <!--Loader and modal-->



    <gux-modal id="preview-modal" size="large">
      <div slot="content" id="preview-modal-content">
    
      </div>
      <gux-cta-group slot="footer" align="end">
        <gux-button slot="primary" id="claim-email" autofocus
          >Claim email</gux-button
        >
        <gux-button
          slot="dismiss"
          onclick="document.getElementById('preview-modal').close()"
          >Cancel</gux-button
        >
      </gux-cta-group>
    </gux-modal>

    <gux-modal id="delete-modal" size="medium">
      <div slot="content" id="preview-modal-content">
        <p>Are you sure to disconnect selected emails?</p>
      </div>
      <gux-cta-group dangerous slot="footer" align="end" danger variant>
        <gux-button slot="primary" id="delete-email-modal-button" autofocus
          >Disconnect</gux-button
        >
        <gux-button
          slot="dismiss"
          onclick="document.getElementById('delete-modal').close()"
          >Cancel</gux-button
        >
      </gux-cta-group>
    </gux-modal>



    <script>
     

    </script>
  </body>
  <style
  onload="(function () {
    function ascending(a, b, columnIndex) {
      const aDate = getDate(a.querySelectorAll('td')[columnIndex].textContent);
      const bDate = getDate(b.querySelectorAll('td')[columnIndex].textContent);
      return aDate - bDate;
    }

    function getDate(date) {
      const [datePart, timePart] = date.split(',');
      const [day, month, year] = datePart.split('/').map(Number);
      const [hours, minutes] = timePart.split(':').map(Number);
      return new Date(year, month - 1, day, hours, minutes);
    }

    function shuffle(a, b) {
      return 0.5 - Math.random();
    }

    const table = document.querySelector('#sortable-table');

    table.addEventListener('guxsortchanged', (event) => {
      console.log('event', event.detail);
      const { columnName, sortDirection } = event.detail;
      const columns = Array.from(table.querySelectorAll('thead tr th')).forEach((column) => column.removeAttribute('aria-sort'));
      const column = table.querySelector(`thead tr th[data-column-name='${columnName}']`);
      console.log('column', column);
      column.setAttribute('aria-sort', sortDirection);
      const tableBody = table.querySelector('tbody');
      let columnIndex;
      switch (columnName) {
        case 'start-date':
          columnIndex = 1;
          break;
        case 'endDate':
          columnIndex = 2;
          break;
        default:
          columnIndex = 1;
          break;
      }
      switch (sortDirection) {
        case 'ascending':
          [...tableBody.children].sort((a, b) => ascending(a, b, columnIndex)).forEach(node => tableBody.appendChild(node));
          break;
        case 'descending':
          [...tableBody.children].sort((a, b) => ascending(a, b, columnIndex)).reverse().forEach(node => tableBody.appendChild(node));
          break;
        default:
          [...tableBody.children].sort(shuffle).forEach(node => tableBody.appendChild(node));
          break;
      }
    });
  })()"
  >

      display: none;
    }
    .view.active {
      display: block;
    }
    .not-used {
      -custom-noop: noop;
    }

    .gux-sticky-cell {
