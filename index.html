<!DOCTYPE html>

<html>
  <head>
    <meta name="robots" content="noindex" />
    <meta charset="utf-8" />

    <title></title>
    <meta name="Template" content="" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"

    <link rel="stylesheet" href="/src/styles.css">

  <body>
    <br />
    <div id="originalView" class="view active">
      <!-- <gux-button id="refresh" class="btn">
        
        <gux-icon id="refresh" icon-name="refresh" decorative></gux-icon>
      </gux-button> -->
      <form id="searchForm" >
        <!-- <form onchange="searchByEmail(event)" oninput="searchByEmail(event)" id="searchForm"> -->

        <fieldset>
          <gux-form-field-search>
            <input slot="input" type="search" id="searchEmail" />
            <label slot="label">Search by email</label>
          </gux-form-field-search>
        </fieldset>
      </form>
      <div class="date-select">
        <gux-button id="move-period-back"
        ><gux-icon
          icon-name="chevron-left"
          screenreader-text="This will be read by a screen reader"
        ></gux-icon
      ></gux-button>
        <gux-form-field-text-like label-position="screenreader">
          <input slot="input" type="text" name="lp-5" id="search-dates" readonly style="text-align:center" />
          <label slot="label">Screenreader</label>
        </gux-form-field-text-like>
        <gux-button id="move-period-forward"
        ><gux-icon
          icon-name="chevron-right"
          screenreader-text="This will be read by a screen reader"
        ></gux-icon
      ></gux-button>
      </div>
      
      <gux-table
        object-table
        selectable-rows

        id="sortable-table"
      >
        <table style="inline-size: 100%; table-layout: fixed" slot="data">
          <thead>
            <tr data-row-id="head">
              <!-- <th><gux-all-row-select></gux-all-row-select></th> -->
              <!-- <th data-column-name="priority" data-cell-numeric aria-sort="ascending">Priority<gux-sort-control /></th> -->
              <th data-column-name="originatingDirection" style="width: 80px;">Direction</th>

              <th data-column-name="start-date" aria-sort="ascending">
                Start Date<gux-sort-control />
              </th>
              <th data-column-name="endDate" class="end-date-column">End date</th>
              <th data-column-name="from" class="end-date-column">From</th>
              <th data-column-name="subject" class="subject-column">Subject</th>
              <th data-column-name="status" class="status-column">Status</th>
              <!-- <th data-column-name="routing-state">Routing State</th> -->
              <th data-column-name="assigned-to">Assigned To</th>
              <th data-column-name="queue" class="end-date-column">Queue</th>
              <!-- <th data-column-name="worktype">Worktype</th> -->
              <th data-column-name="external-tag" class="end-date-column">External Tag</th>
              <!-- <th data-column-name="name">Name</th> -->
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </gux-table>
    </div>

    <div id="separateView" class="view">
      <gux-button id="backToOriginalView">Back</gux-button>

      <gux-tabs-advanced>
        <gux-tab-advanced-list
          slot="tab-list"
          allow-sort="false"
          show-new-tab-button="false"
          tab-limit="4"
        >
          <gux-tab-advanced tab-id="emailListTab">
            <gux-icon icon-name="user-directory" decorative="true"></gux-icon>
            Email
          </gux-tab-advanced>
          <gux-tab-advanced tab-id="emailAttachmentTab" id="attachmentTab">
            <gux-icon icon-name="attachment" decorative="true"></gux-icon>
            Attachment
          </gux-tab-advanced>
          
        </gux-tab-advanced-list>
        <gux-tab-advanced-panel tab-id="emailListTab">
          <span id="messages-content"></span>
        </gux-tab-advanced-panel>
        <gux-tab-advanced-panel tab-id="emailAttachmentTab">
          <span>Attachments in message thread</span>
          <div id="threadAttachments"></div>
        </gux-tab-advanced-panel>
        
      </gux-tabs-advanced>


      <!-- <gux-accordion single-open-section> </gux-accordion> -->
      <!-- Separate view content here -->
    </div>

    <!--Loader and modal-->

    <gux-radial-loading
      id="loading"
      class="loading"
      screenreader-text="Loading..."
    ></gux-radial-loading>

    <gux-modal id="modal" size="small">
      <div slot="title">Warning!</div>
      <div slot="content">
        You are about to terminate the selected Workitems are you sure you want
        to do this?
      </div>
      <div slot="start-align-buttons">
        <gux-button-slot accent="primary">
          <button
            onclick="terminateWorkItem(document.getElementById('dropdownWorkbin').value)"
            type="button"
          >
            Accept
          </button>
        </gux-button-slot>
      </div>
      <div slot="end-align-buttons">
        <gux-button-slot>
          <button
            autofocus
            onclick="document.getElementById('modal').close()"
            type="button"
          >
            Cancel
          </button>
        </gux-button-slot>
      </div>
    </gux-modal>

    <script>
     
      
// function searchByEmail(event){
//   event.preventDefault();
//   console.log("event", event);
// }
    </script>
  </body>
  <style
  onload="(function () {
    function ascending( a, b ) {
      if ( a.textContent < b.textContent ){
        return -1;
      }
      if ( a.textContent > b.textContent ){
        return 1;
      }
      return 0;
    }
    function shuffle( a, b ) {
      return 0.5 - Math.random();
    }
    const table = document.querySelector('#sortable-table');
    table.addEventListener('guxsortchanged',
    (event) => {
      const {columnName, sortDirection} = event.detail;
      const columns = Array.from(table.querySelectorAll('thead tr th')).forEach((column) => column.removeAttribute('aria-sort'));
      const column = table.querySelector(`thead tr th[data-column-name='` + columnName + `']`);
      column.setAttribute('aria-sort', sortDirection);
      const tableBody = table.querySelector('tbody');
      switch (sortDirection) {
        case 'ascending':
          [...tableBody.children].sort(ascending).forEach(node=>tableBody.appendChild(node));
          break;
        case 'descending':
          [...tableBody.children].sort(ascending).reverse().forEach(node=>tableBody.appendChild(node));
          break;
        default:
          [...tableBody.children].sort(shuffle).forEach(node=>tableBody.appendChild(node));
          break;
      }
    })
  })()"
  >
    .view {
      display: none;
    }
    .view.active {
      display: block;
    }
    .not-used {
      -custom-noop: noop;
    }

    .gux-sticky-cell {
      position: sticky;
      left: 0;
      z-index: 1;
    }

    .gux-sticky-cell-2 {
      position: sticky;
      left: 89px;
      z-index: 1;
    }

    .gux-sticky-cell-header-style {
      background-color: var(
        --gse-ui-dataTableItems-header-fixedBackgroundColor
      );
    }
    .drop {
      width: 25dvw;
      max-width: 200px;
      display: block;
      margin: 8px;
    }
    .btn {
      margin: 8px;
      align-self: center;
    }
    .btn_right {
      align-self: center;
      margin-left: auto;
      margin-top: 8px;
      margin-bottom: 8px;
      margin-right: 8px;
    }
    .tbody {
      min-height: 200px;
    }
    .loading {
      display: none;
      margin-left: 47%;
    }
  </style>
</html>
